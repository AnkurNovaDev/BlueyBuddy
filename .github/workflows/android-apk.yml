name: Build Bluey Buddy APK

'on':
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build debug APK
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install SDK packages
    run: |
      echo "ANDROID_HOME=$ANDROID_HOME"
      echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
      SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" /opt/android-sdk /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
      if [ -z "$SDKMANAGER" ]; then
        echo "::error::Could not find sdkmanager"
        exit 1
      fi
      yes | "$SDKMANAGER" --licenses || true
      "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Build APK
    run: gradle --no-daemon assembleDebug

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: BlueyBuddy-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
