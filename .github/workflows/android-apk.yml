name: Build Bluey Buddy APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'BlueyBuddy-GitHub-Upload.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f BlueyBuddy-GitHub-Upload.zip
          mkdir -p source
          unzip -q BlueyBuddy-GitHub-Upload.zip -d source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Align Kotlin standard library versions
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle")
          text = gradle_file.read_text(encoding="utf-8")

          alignment = """configurations.configureEach {
              resolutionStrategy.eachDependency {
                  if (requested.group == 'org.jetbrains.kotlin') {
                      useVersion '1.8.22'
                  }
              }
          }

          """

          if "resolutionStrategy.eachDependency" not in text:
              marker = "dependencies {"
              if marker not in text:
                  raise SystemExit("Could not find dependencies block in app/build.gradle")
              text = text.replace(marker, alignment + marker, 1)
              gradle_file.write_text(text, encoding="utf-8")

          print("Kotlin dependencies aligned to 1.8.22")
          PY

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueyBuddy-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
